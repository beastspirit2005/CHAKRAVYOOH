[project]
name = "chakravyuh-cyclone-ml"
version = "0.1.0"
description = "Chakravyuh Cyclone Intelligence Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0",
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.12",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pynacl>=1.5.0",
    "groq>=0.4.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiosmtplib>=3.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.5",
    "websockets>=12.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
cds = ["cdsapi>=0.6.1"]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.10.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["ml", "ml.cyclone"]

[tool.pytest.ini_options]
testpaths = ["tests", "ml/cyclone/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
