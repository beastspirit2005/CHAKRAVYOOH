      }

    /* Precision Diamond-Cut Tactical Button Styling */
    .diamond-btn-outer {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 1px;
      clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0% calc(100% - 10px), 0% 10px);
      transition: all 0.25s ease;
    }
    .diamond-btn-inner {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      height: 100%;
      padding: 0.75rem 1.35rem;
      clip-path: polygon(9px 0%, calc(100% - 9px) 0%, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0% calc(100% - 9px), 0% 9px);
      transition: all 0.25s ease;
    }

    .custom-radar-pulse {
      position: relative;
      width: 24px;
      height: 24px;
    }
    .custom-radar-pulse::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid #ef4444;
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .custom-radar-pulse::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 12px #ef4444;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .leaflet-control-attribution { background: rgba(3,7,18,0.85) !important; color: #94a3b8 !important; font-size: 10px; }
    .leaflet-control-attribution a { color: #38bdf8 !important; }

    /* Taras Boiko iOS Weather Widgets (Pixel Art & Isometric 3D Design) */
    .font-pixel {
      font-family: 'Pixelify Sans', 'Silkscreen', monospace;
      image-rendering: pixelated;
    }

    .font-silkscreen {
      font-family: 'Silkscreen', monospace;
      image-rendering: pixelated;
    }

    .isometric-stage {
      perspective: 1600px;
      perspective-origin: 50% 35%;
    }

    .isometric-grid {
      transform: rotateX(20deg) rotateZ(-12deg) skewX(3deg);
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .isometric-grid.flat-view {
      transform: rotateX(0deg) rotateZ(0deg) skewX(0deg);
    }

    .pixel-widget-card {
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 44px -10px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transform-style: preserve-3d;
      border: 2px solid rgba(255, 255, 255, 0.12);
      
      /* Scroll Reveal Entrance: hidden, translated downwards, scaled and soft-focused */
      opacity: 0;
      transform: translateY(54px) scale(0.93);
      filter: blur(5px);
      transition: 
        opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.35s ease,
        border-color 0.25s ease;
      will-change: opacity, transform, filter;
    }

    /* Revealed in View State triggered upon scrolling down */
    .pixel-widget-card.widget-revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    /* Staggered entrance ripple delays */
    .pixel-widget-card:nth-child(1) { transition-delay: 60ms; }
    .pixel-widget-card:nth-child(2) { transition-delay: 140ms; }
    .pixel-widget-card:nth-child(3) { transition-delay: 220ms; }
    .pixel-widget-card:nth-child(4) { transition-delay: 300ms; }
    .pixel-widget-card:nth-child(5) { transition-delay: 380ms; }
    .pixel-widget-card:nth-child(6) { transition-delay: 460ms; }

    /* Interactive hover state once revealed */
    .pixel-widget-card.widget-revealed:hover {
      transform: translateY(-14px) translateZ(28px) scale(1.04);
      box-shadow: 0 36px 64px -12px rgba(0, 0, 0, 0.95), 0 0 32px rgba(56, 189, 248, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      border-color: rgba(56, 189, 248, 0.6);
      z-index: 10;
      transition-delay: 0ms !important;
    }

    /* Header scroll reveal */
    .widgets-header-reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .widgets-header-reveal.widget-revealed {
      opacity: 1;
      transform: translateY(0);
    }

      background: linear-gradient(180deg, #9a3412 0%, #7c2d12 45%, #431407 100%);
    }

    .pixel-bg-storm {
      background: linear-gradient(180deg, #0c202d 0%, #081720 50%, #03080d 100%);
    }

    .pixel-bg-rainy {
      background: linear-gradient(180deg, #132e3b 0%, #0d212b 50%, #050d12 100%);
    }

    .pixel-bg-swell {
      background: linear-gradient(180deg, #0c2b54 0%, #081d38 50%, #030b17 100%);
    }

    .pixel-bg-cold {

    }

    }

    @keyframes pixelRainDrop {
      0% { transform: translateY(-20px) translateX(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(120px) translateX(-25px); opacity: 0; }

    .pixel-raindrop {
      position: absolute;
      width: 2px;
      height: 10px;
      background: #38bdf8;
      opacity: 0.6;
      animation: pixelRainDrop 1.1s linear infinite;
    }

    @keyframes pixelLightningFlash {
      0%, 92%, 100% { opacity: 0; }
      93%, 95% { opacity: 0.9; }
      94% { opacity: 0.2; }
    }

      animation: pixelLightningFlash 4.5s ease-in-out infinite;
    }

    // State Mutation Helper
    function setState(updater) {
      if (typeof updater === 'function') {
        state = updater(state);
      } else {
        state = { ...state, ...updater };
      }
      if (typeof isTacticalExpanded !== 'undefined' && isTacticalExpanded) {
        updateTacticalDeckDOM();
      } else {
        renderApp();
      }
    }

    function setTacticalScreen(screenId) {
      if (!state.isLoggedIn) {
        state.pendingAction = () => {
          setTacticalScreen(screenId);
        };
        openLoginModal();
        return;
      }
      const isScreenChanged = state.activeScreen !== screenId;
      state.activeScreen = screenId;

      const scroller = document.getElementById('tacticalDeckScrollArea');
      const deck = document.getElementById('commandCenterContentDeck') || scroller;
      const navTabs = document.getElementById('commandCenterNavTabs');

      if (state.activePortalView === 'command_center' && scroller) {
        // 1. Update the tabs in header to highlight active tab
        if (navTabs && typeof renderNavTabButtons === 'function') {
          navTabs.innerHTML = renderNavTabButtons();
        }
        const modalTabs = document.getElementById('modalTacticalNavTabs');
        if (modalTabs && typeof renderNavTabButtons === 'function') {
          modalTabs.innerHTML = renderNavTabButtons();
        }
        const globalTabs = document.getElementById('globalHeaderNavTabs');
        if (globalTabs && typeof renderNavTabButtons === 'function') {
          globalTabs.innerHTML = renderNavTabButtons();
        }

        // 2. If screen changed, update content
        if (isScreenChanged) {
          let screenHtml = '';
          if (screenId === 'screen1_hero') screenHtml = renderScreen1Hero();
          else if (screenId === 'screen_mosdac') screenHtml = renderScreenMosdac();
          else if (screenId === 'screen2_ai') screenHtml = renderScreen2AI();
          else if (screenId === 'screen3_risk') screenHtml = renderScreen3Risk();
          else if (screenId === 'screen4_resilience') screenHtml = renderScreen4Resilience();
          else screenHtml = renderScreen1Hero();

          scroller.innerHTML = screenHtml;
          scroller.scrollTop = 0;
        }

        // 3. Smooth entrance slide-down animation on the content deck
        if (deck) {
          deck.classList.remove('animate-tab-slide-down');
          void deck.offsetWidth; // Force reflow
          deck.classList.add('animate-tab-slide-down');
        }

        // 4. Automatically slide / smooth-scroll the window down so the contents are shown properly
        slideDownToDeck();
      } else {
        renderApp();
        setTimeout(slideDownToDeck, 120);
      }
    }

    function slideDownToDeck() {
      const deck = document.getElementById('commandCenterContentDeck') || document.getElementById('tacticalDeckScrollArea');
      if (!deck) return;

      const header = document.querySelector('header');
      const headerH = header ? header.offsetHeight : 60;
      
      const rect = deck.getBoundingClientRect();
      const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
      // Position the top of the content card cleanly below the header with 12px breathing room
      const targetScrollY = currentScrollY + rect.top - headerH - 12;

      window.scrollTo({
        top: Math.max(0, targetScrollY),
        behavior: 'smooth'
      });
    }

    function renderNavTabButtons() {
      const tabs = [
        { id: 'screen1_hero', num: '01', icon: '🌀', label: 'Cyclone Intel', action: "setTacticalScreen('screen1_hero')" },
        { id: 'screen_mosdac', num: '02', icon: '🛰️', label: 'Live MOSDAC', action: "openLiveMosdac()" },
        { id: 'screen2_ai', num: '03', icon: '🧠', label: 'AI Fusion', action: "setTacticalScreen('screen2_ai')" },
        { id: 'screen3_risk', num: '04', icon: '⚠️', label: 'Risk Matrix', action: "viewRiskMatrix()" },
        { id: 'screen4_resilience', num: '05', icon: '🛡️', label: 'Resilient Mesh', action: "openMeshOperations()" }
      ];

      return tabs.map(tab => {
        const isActive = state.activeScreen === tab.id;
        return `
          <button onclick="${tab.action}" class="flex items-center gap-1.5 px-2 sm:px-2.5 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-colors cursor-pointer whitespace-nowrap active:scale-[0.98] ${
            isActive

              : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border border-transparent'
          }">
            <span class="w-4.5 h-4.5 rounded flex items-center justify-center text-[9px] sm:text-[10px] font-mono font-bold shrink-0 ${
              isActive
                ? 'bg-cyan-950 text-cyan-300 border border-cyan-700/50'
                : 'bg-slate-800 text-slate-500 border border-slate-700/60'
            }">${tab.num}</span>
            <span class="text-xs sm:text-sm">${tab.icon}</span>
            <span>${tab.label}</span>
            ${isActive ? '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 ml-0.5"></span>' : ''}
          </button>
        `;
      }).join('');
    }

    function initTacticalDeckEvents() {
      const el = document.getElementById('commandCenterPage') || document.getElementById('tacticalHudOverlay');
      if (!el || el._tacticalEventsBound) return;
      el._tacticalEventsBound = true;

      // Wheel handler: allow native smooth scrolling across the page and inside the deck
      el.addEventListener('wheel', function(e) {
        const scrollArea = document.getElementById('tacticalDeckScrollArea');
        if (!scrollArea) return;

        // If hovering directly over the scroll area or its cards/widgets, let the browser scroll natively
        if (e.target && e.target.closest && e.target.closest('#tacticalDeckScrollArea')) {
          return;
        }

        // If hovering over header, banners, or outer content, let the page scroll naturally
        if (e.target && e.target.closest && e.target.closest('header, nav, #commandCenterNavTabs, #commandCenterContentDeck, .mission-card, #secondaryTelemetryBanner')) {
          return;
        }
      }, { passive: true });

      // Prevent dragging or selecting in tabs from spinning the 3D globe
      el.addEventListener('pointerdown', function(e) {
        if (e.target && e.target.closest && e.target.closest('#prefaceInteractiveGlobe')) return;
        e.stopPropagation();
      });
      el.addEventListener('mousedown', function(e) {
        if (e.target && e.target.closest && e.target.closest('#prefaceInteractiveGlobe')) return;
        e.stopPropagation();
      });
      el.addEventListener('touchstart', function(e) {
        if (e.target && e.target.closest && e.target.closest('#prefaceInteractiveGlobe')) return;
        e.stopPropagation();
      }, { passive: true });
    }

    function updateTacticalDeckDOM() {
      const scroller = document.getElementById('tacticalDeckScrollArea');
      if (state.activePortalView === 'command_center' && scroller) {
        let screenHtml = '';
        if (state.activeScreen === 'screen1_hero') screenHtml = renderScreen1Hero();
        else if (state.activeScreen === 'screen_mosdac') screenHtml = renderScreenMosdac();
        else if (state.activeScreen === 'screen2_ai') screenHtml = renderScreen2AI();
        else if (state.activeScreen === 'screen3_risk') screenHtml = renderScreen3Risk();
        else if (state.activeScreen === 'screen4_resilience') screenHtml = renderScreen4Resilience();
        else screenHtml = renderScreen1Hero();
        scroller.innerHTML = screenHtml;
      }
      const hud = document.getElementById('tacticalHudOverlay');
      if (hud && typeof renderTacticalDeckContent === 'function') {
        hud.innerHTML = renderTacticalDeckContent();
        initTacticalDeckEvents();
      }
    }

    async function fetchRealtimeWeather(stationKey) {
      setState({ isFetchingLive: true });
      const targetStation = stationKey || state.activeStation;

      const stationCoords = {
        gopalpur: { name: 'Gopalpur Coastal Radar & Weather Station (Odisha)', query: 'Gopalpur', lat: 19.26, lon: 84.91, buoy: 'BD10' },

      }[targetStation] || { name: 'Gopalpur Station', query: 'Gopalpur', lat: 19.26, lon: 84.91, buoy: 'BD10' };

      try {
        const response = await fetch(`https://wttr.in/${stationCoords.query}?format=j1`, { cache: 'no-cache' });

    // =========================================================================
    // AUTHORITATIVE 2D CYCLONE RISK MATRIX BACKEND INTEGRATION
    // =========================================================================
    async function fetchRiskMatrix() {
      state.isFetchingRiskMatrix = true;
      const statusPill = document.getElementById('riskBackendStatusPill');
      if (statusPill) statusPill.classList.add('animate-pulse');

      try {
        const response = await fetch('/api/v1/cyclone/risk-matrix', { cache: 'no-cache' });
        if (response.ok) {
          const data = await response.json();
          state.backendRiskMatrix = data;
          state.isBackendConnected = true;
          state.isFetchingRiskMatrix = false;
          if (data.risk_zones && Array.isArray(data.risk_zones)) {
            state.riskZones = data.risk_zones;
          }
          if (data.matrix_grid && data.matrix_grid[0]?.cells?.[3]) {
            if (!state.selectedMatrixCell) {
              state.selectedMatrixCell = { ...data.matrix_grid[0].cells[3], tier: data.matrix_grid[0].tier, surge_level: data.matrix_grid[0].surge_level };
            }
          }
          if (state.activeScreen === 'screen3_risk') {
            const scroller = document.getElementById('tacticalDeckScrollArea');
            if (scroller) scroller.innerHTML = renderScreen3Risk();
          }
          return;
        }
      } catch (err) {
        console.warn('Backend risk matrix endpoint offline, continuing with calibrated high-fidelity matrix:', err);
      }
      state.isFetchingRiskMatrix = false;
      if (state.activeScreen === 'screen3_risk') {
        const scroller = document.getElementById('tacticalDeckScrollArea');
        if (scroller) scroller.innerHTML = renderScreen3Risk();
      }
    }

    function viewRiskMatrix() {
      if (!state.isLoggedIn) {
        state.pendingAction = () => {
          viewRiskMatrix();
        };
        openLoginModal();
        return;
      }
      if (state.activePortalView !== 'command_center') {
        state.activePortalView = 'command_center';
        state.activeScreen = 'screen3_risk';
        renderApp();
      } else {
        setTacticalScreen('screen3_risk');
      }
      if (!state.backendRiskMatrix || !state.isBackendConnected) {
        fetchRiskMatrix();
      }
      setTimeout(slideDownToDeck, 70);
    }

    // Dispatch Fleet Handler
    function handleDispatch(incId, resType) {
      const targetInc = state.incidents.find(i => i.id === incId) || state.incidents[0];
      const avail = state.resources.find(r => r.status === 'AVAILABLE' && (resType ? r.type === resType : true)) || state.resources.find(r => r.status === 'AVAILABLE');
      
      if (avail) {
        const updatedRes = state.resources.map(r => r.id === avail.id ? { ...r, status: 'DISPATCHED', assignedIncidentCode: targetInc.code, etaMinutes: 5 } : r);
        setState(s => ({
          ...s,
          resources: updatedRes,
          selectedIncidentId: null
        }));
        alert(`🚨 Dispatched [ ${avail.callsign} ] to ${targetInc.code} (${targetInc.location.sector})`);
      } else {
        alert('Notice: All specialized emergency units are currently deployed on coastal missions.');
      }
    }

    let loadingInterval = null;

    function startLoadingSequence() {
      if (loadingInterval) clearInterval(loadingInterval);
      let prog = 24;

      loadingInterval = setInterval(() => {
        prog += Math.floor(Math.random() * 8) + 8;
        if (prog >= 100) {
          prog = 100;
          clearInterval(loadingInterval);
          loadingInterval = null;

          updateLoadingHUD(100, 'FUSION MATRIX LOCKED — MISSION SYSTEM READY.');
          setTimeout(() => {
            dismissLoadingScreen();
          }, 450);
          return;
        }

        let stepMsg = 'INGESTING ISRO MOSDAC SCORPIO LIVE FEED...';
        if (prog >= 45 && prog < 68) {
          stepMsg = 'SYNCHRONIZING INCOIS MOORED BUOY ARRAY (BD08 / BD10)...';
        } else if (prog >= 68 && prog < 88) {
          stepMsg = 'INITIALIZING PINN CYCLONE TRAJECTORY ENGINE...';
        } else if (prog >= 88) {
          stepMsg = 'CALIBRATING CHAKRAVYOOH MESH RELAYS ACROSS COASTAL BELT...';
        }

        updateLoadingHUD(prog, stepMsg);
      }, 130);
    }

      const fill = document.getElementById('loadingProgressFill');
      const pct = document.getElementById('loadingPercentText');
      const step = document.getElementById('loadingStepText');

      if (fill) fill.style.width = prog + '%';
      if (pct) pct.textContent = prog + '%';
      if (step) step.textContent = stepMsg;

      if (prog >= 45) {
        const cBuoy = document.getElementById('check-buoy');
        const sBuoy = document.getElementById('status-buoy');
        if (cBuoy) { cBuoy.className = 'text-emerald-400 font-bold'; cBuoy.textContent = '✓'; }

      if (prog >= 68) {

        const sPinn = document.getElementById('status-pinn');
        if (cPinn) { cPinn.className = 'text-emerald-400 font-bold'; cPinn.textContent = '✓'; }

      if (godsEyeHud) {
        godsEyeHud.classList.remove('hidden');
        void godsEyeHud.offsetWidth;
        godsEyeHud.classList.remove('opacity-0', 'pointer-events-none');
        godsEyeHud.classList.add('opacity-100', 'pointer-events-auto');
      }

      // 3. Smoothly rotate Earth directly to Bay of Bengal & Cyclone BOB-04 coordinates (16.82N, 84.48E)
      if (inst) {
        inst.setTargetRotation(0.32, Math.PI * 0.965, 2.45);
      }

      // 4. Dramatic Zoom In: Camera plunges down toward the storm center
      const start = performance.now();
      const zoomDuration = 1100;
      
      function plungeCamera(now) {
        const elapsed = now - start;
        const progress = Math.min(1, elapsed / zoomDuration);
        const easeProgress = progress * progress; // Quadratic ease-in plunge
        
        if (inst && inst.camera) {
          // Plunge from 2.45 down to 0.72 into the clouds
          inst.camera.position.z = 2.45 - (2.45 - 0.72) * easeProgress;
          inst.globeGroup.rotation.y = Math.PI * 0.965;
          inst.globeGroup.rotation.x = 0.32;
        }

        if (progress < 1) {
          requestAnimationFrame(plungeCamera);
        } else {
          // 5. Seamlessly fulfill the screen with the live real-life satellite feed map!
          transitionToSatelliteMap();
        }
      }

      // Brief delay for rotation alignment, then plunge camera
      setTimeout(() => {
        requestAnimationFrame(plungeCamera);
      }, 300);
    }

          launchTacticalDeck(targetScreen);
        };
        openLoginModal();
        return;
      }
      if (targetScreen) state.activeScreen = targetScreen;
      isTacticalExpanded = true;
      const textCard = document.getElementById('heroTextCard');
      const heroDock = document.getElementById('heroDock');
      const deckTelemetry = document.getElementById('deckLaunchTelemetry');
      const inst = activeGlobeInstances['prefaceInteractiveGlobe'];

      if (textCard) {

        state.prefaceTargetName = "Indian Subcontinent & Bay of Bengal";
        focusGlobeTarget('india');
      } else if (target === 'global') {
        state.prefaceCoords = "00° 00' N  80° 00' E";
        state.prefaceTargetName = "Global Earth Constellation Overview";

      renderApp();

    // =========================================================================
    // ISRO SAC MOSDAC SCORPIO INTERACTIVE WIDGET ENGINE (Screenshot Exact UI)
    // =========================================================================
    function handleScorpioMouseMove(e, elementId) {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      // Map x, y into approximate Indian Ocean Lat / Lon space
      const lon = (30 + x * 90).toFixed(4);
      const lat = (40 - y * 65).toFixed(4);
      state.scorpioCoords = `${lon}, ${lat}`;
      const coordEl = document.getElementById(elementId + '_coords');
      if (coordEl) coordEl.textContent = state.scorpioCoords;
    }

    function handleScorpioZoom(delta, elementId) {
      state.scorpioZoom = Math.max(0.8, Math.min(2.5, state.scorpioZoom + delta * 0.25));
      const mapEl = document.getElementById(elementId + '_map');
      if (mapEl) {
        mapEl.style.transform = `scale(${state.scorpioZoom})`;
      }
    }

    function handleScorpioScrub(val, elementId) {
      state.scorpioTimelineProgress = val;
      // Convert progress (0 - 100) to time between 05:30 and 15:00 (570 minutes span)
      const startMins = 5 * 60 + 30;
      const currentMins = Math.round(startMins + (val / 100) * (9 * 60 + 30));
      const h = String(Math.floor(currentMins / 60)).padStart(2, '0');
      const m = String(currentMins % 60).padStart(2, '0');
      state.scorpioTimestamp = `08-SEP-2026 ${h}:${m}`;
      const timeEl = document.getElementById(elementId + '_timestamp');
      if (timeEl) timeEl.textContent = `${state.scorpioTimestamp} Imager/INSAT3DR/3DS IMG_TIR1`;
    }

      if (layer === 'wind') state.scorpioWindActive = !state.scorpioWindActive;
      if (layer === 'scat') state.scorpioScatActive = !state.scorpioScatActive;

    // =========================================================================

    function stepZoomEarthTime(deltaMinutes) {

      if (totalMins >= 24 * 60) totalMins = 0;
      state.zoomEarthHour = Math.floor(totalMins / 60);
      state.zoomEarthMinute = totalMins % 60;
      renderApp();

    function jumpToZoomEarthLocation(lat, lon, label) {
      state.zoomEarthCoords = `${lat > 0 ? lat.toFixed(2) + '° N' : Math.abs(lat).toFixed(2) + '° S'}  ${lon > 0 ? lon.toFixed(2) + '° E' : Math.abs(lon).toFixed(2) + '° W'}`;

    // =========================================================================
    // THREE.JS 3D INTERACTIVE GLOBE & CYCLONE OBSERVATORY ENGINE
    // =========================================================================
    let activeGlobeInstances = {};
    let cachedEarthTexture = null;

    // Generate high-resolution procedural Earth texture with India & Bay of Bengal focus
    function createProceduralEarthCanvas() {
      if (cachedEarthTexture) return cachedEarthTexture;

      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;

      // Deep Space Oceanic Gradient
      const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
      oceanGrad.addColorStop(0.0, '#040914');
      oceanGrad.addColorStop(0.2, '#06142a');
      oceanGrad.addColorStop(0.5, '#0b2347');
      oceanGrad.addColorStop(0.8, '#06142a');
      oceanGrad.addColorStop(1.0, '#040914');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, 2048, 1024);

      // Lat / Lon Graticule Grid
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
      ctx.lineWidth = 1;
      for (let lat = -80; lat <= 80; lat += 20) {
        const y = ((90 - lat) / 180) * 1024;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(2048, y);
        ctx.stroke();
      }
      for (let lon = -180; lon <= 180; lon += 30) {
        const x = ((lon + 180) / 360) * 2048;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1024);
        ctx.stroke();
      }

      // Helper to project (lat, lon) -> (x, y)
      function coord(lat, lon) {
        return [
          ((lon + 180) / 360) * 2048,
          ((90 - lat) / 180) * 1024
        ];
      }

      function drawLandPoly(coords, fillColor, strokeColor, lineWidth = 1.2) {
        if (!coords || coords.length < 3) return;
        ctx.beginPath();
        const [x0, y0] = coord(coords[0][0], coords[0][1]);
        ctx.moveTo(x0, y0);
        for (let i = 1; i < coords.length; i++) {
          const [x, y] = coord(coords[i][0], coords[i][1]);
          ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();
        if (strokeColor) {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
      }

      const landBase = '#0f1d33';
      const landBorder = '#1c3459';

      // Eurasia & North Africa
      drawLandPoly([
        [70, 20], [70, 160], [60, 170], [45, 140], [35, 120], [25, 105], [20, 95],
        [10, 78], [15, 65], [25, 55], [30, 32], [35, -5], [45, -5], [55, 10], [60, 25]
      ], landBase, landBorder, 1.2);

      // Africa
      drawLandPoly([
        [32, -5], [32, 32], [12, 51], [2, 45], [-12, 40], [-25, 33], [-35, 20],
        [-33, 17], [-15, 12], [5, 2], [15, -17], [25, -15]
      ], landBase, landBorder, 1.2);

      // Australia
      drawLandPoly([
        [-11, 132], [-14, 144], [-24, 153], [-37, 150], [-38, 140], [-32, 116], [-21, 114], [-15, 125]
      ], landBase, landBorder, 1.2);

      // Americas
      drawLandPoly([
        [70, -165], [70, -60], [50, -55], [30, -80], [20, -100], [30, -120], [55, -130], [65, -165]
      ], landBase, landBorder, 1.0);
      drawLandPoly([
        [12, -75], [5, -50], [-10, -35], [-35, -55], [-55, -70], [-40, -73], [-20, -70], [0, -80]
      ], landBase, landBorder, 1.0);

      // Southeast Asia / Malay Archipelago
      drawLandPoly([
        [22, 100], [15, 108], [5, 104], [-6, 106], [-8, 115], [-5, 120], [7, 117], [16, 106]
      ], '#132540', '#224470', 1.2);

      // HIGH-PRECISION FOCUS: INDIAN SUBCONTINENT (Bright Cyan Coastline & Institutional Glow)
      const indiaPolygon = [
        [35.5, 74.8], [34.5, 77.5], [32.0, 78.9], [29.5, 80.5], [27.0, 88.5],
        [27.5, 92.5], [26.0, 97.0], [24.0, 93.5], [22.5, 89.5], // Bengal Delta
        [21.5, 87.0], [19.8, 85.8], [19.26, 84.91], // Odisha (Gopalpur landfall target)
        [17.7, 83.3], [16.0, 80.8], [13.0, 80.3], [10.0, 79.8], [8.1, 77.5], // Kanyakumari
        [8.8, 76.5], [12.9, 74.8], [15.4, 73.8], [18.9, 72.8], [21.0, 72.5], // Mumbai / Konkan
        [21.7, 70.0], [22.5, 69.0], [23.8, 68.5], [24.5, 71.0], [28.0, 70.0], [31.0, 74.5], [35.5, 74.8]
      ];
      drawLandPoly(indiaPolygon, '#182f52', '#38bdf8', 2.6);

      // Sri Lanka
      drawLandPoly([
        [9.8, 80.2], [8.0, 81.8], [6.0, 80.6], [7.2, 79.8]
      ], '#182f52', '#38bdf8', 2.0);

      // Bay of Bengal Cyclone Operations Basin (Target Boundary & Hatching)
      const bobPolygon = [[22.5, 85.0], [22.5, 93.5], [9.0, 93.5], [9.0, 80.0], [15.0, 80.0]];
      ctx.beginPath();
      const [bx0, by0] = coord(bobPolygon[0][0], bobPolygon[0][1]);
      ctx.moveTo(bx0, by0);
      for (let i = 1; i < bobPolygon.length; i++) {
        const [bx, by] = coord(bobPolygon[i][0], bobPolygon[i][1]);
        ctx.lineTo(bx, by);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(14, 165, 233, 0.14)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.setLineDash([8, 6]);
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.setLineDash([]);

      // Cyclone BOB-04 Vortex Cloud Bands Texture on Map
      const [cx0, cy0] = coord(16.82, 84.48);
      const cycGrad = ctx.createRadialGradient(cx0, cy0, 6, cx0, cy0, 90);
      cycGrad.addColorStop(0.0, 'rgba(239, 68, 68, 0.85)');
      cycGrad.addColorStop(0.2, 'rgba(255, 255, 255, 0.7)');
      cycGrad.addColorStop(0.5, 'rgba(186, 230, 253, 0.35)');
      cycGrad.addColorStop(1.0, 'rgba(14, 165, 233, 0)');
      ctx.fillStyle = cycGrad;
      ctx.beginPath();
      ctx.arc(cx0, cy0, 90, 0, Math.PI * 2);
      ctx.fill();

      // Atmospheric cloud bands across equatorial ITCZ
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath();
      ctx.ellipse(1024, 512, 800, 40, 0.05, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      cachedEarthTexture = texture;
      return texture;
    }

    // Convert (Latitude, Longitude, Radius) to 3D Three.js Vector3
    function latLonToVector3(lat, lon, radius = 1.0) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      return new THREE.Vector3(x, y, z);
    }

    // Core interactive 3D Globe initializer
    function initInteractiveGlobe(containerId, options = {}) {
      const container = document.getElementById(containerId);
      if (!container || typeof THREE === 'undefined') return;

      // Reuse active renderer if container already holds canvas to preserve 60fps Earth state
      if (activeGlobeInstances[containerId] && container.querySelector('canvas')) {
        const inst = activeGlobeInstances[containerId];
        if (inst && inst.camera && inst.renderer) {
          const w = container.clientWidth || 800;
          const h = container.clientHeight || 500;
          inst.camera.aspect = w / h;
          inst.camera.updateProjectionMatrix();
          inst.renderer.setSize(w, h);
        }
        return;
      }
      if (activeGlobeInstances[containerId]) {
        try {
          cancelAnimationFrame(activeGlobeInstances[containerId].animId);
          activeGlobeInstances[containerId].renderer.dispose();
          container.innerHTML = '';
        } catch (e) {}
        delete activeGlobeInstances[containerId];
      }

      const width = container.clientWidth || container.offsetWidth || 800;
      const height = container.clientHeight || container.offsetHeight || 500;

      // 1. Scene & Camera Setup
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
      const initialDist = options.initialDistance || 2.45;
      camera.position.set(0, 0.35, initialDist);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      container.appendChild(renderer.domElement);

      // Enable authentic color space rendering
      if (renderer.outputEncoding !== undefined) {
        renderer.outputEncoding = THREE.sRGBEncoding;
      }

      // 2. REALISTIC SPACE LIGHTING (Natural Solar Spectrum + Deep Space Contrast)
      // Deep space ambient light (subtle, prevents washed-out grey tones)
      const ambientLight = new THREE.AmbientLight(0x061120, 0.5);
      scene.add(ambientLight);

      // Primary Warm Solar Direct Light (illuminates Indian subcontinent naturally)
      const sunLight = new THREE.DirectionalLight(0xfffdf5, 2.6);
      sunLight.position.set(6, 2.5, 4.5);
      scene.add(sunLight);

      // Soft Deep-Space Earthshine Rim Light (soft royal blue, no artificial neon)
      const rimLight = new THREE.DirectionalLight(0x1d4ed8, 0.35);
      rimLight.position.set(-6, -2, -4);
      scene.add(rimLight);

      // 3. Main Rotating Globe Group
      const globeGroup = new THREE.Group();
      // Default orientation: Center Indian Subcontinent & Bay of Bengal directly in camera
      globeGroup.rotation.y = Math.PI * 0.96;
      globeGroup.rotation.x = 0.28;
      scene.add(globeGroup);

      // 1. PHOTOREALISTIC NASA BLUE MARBLE SURFACE
      const earthRadius = 1.0;
      const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
      const textureLoader = new THREE.TextureLoader();

      // Authentic NASA Blue Marble photographic satellite textures
      const earthMap = textureLoader.load('/static/earth_atmos_2048.jpg');
      if (earthMap.encoding !== undefined) earthMap.encoding = THREE.sRGBEncoding;
      const normalMap = textureLoader.load('/static/earth_normal_2048.jpg');
      const specularMap = textureLoader.load('/static/earth_specular_2048.jpg');

      const earthMat = new THREE.MeshPhongMaterial({
        map: earthMap,
        normalMap: normalMap,
        normalScale: new THREE.Vector2(0.55, 0.55),
        specularMap: specularMap,
        specular: new THREE.Color(0x223a54),
        shininess: 25
      });
      const earthMesh = new THREE.Mesh(earthGeo, earthMat);
      globeGroup.add(earthMesh);

      // 2. REAL TRANSPARENT SATELLITE CLOUDS (Subtle 50% opacity so vivid oceans & continents show through)
      const cloudMap = textureLoader.load('/static/earth_clouds_1024.png');
      const cloudGeo = new THREE.SphereGeometry(earthRadius * 1.014, 64, 64);
      const cloudMat = new THREE.MeshLambertMaterial({
        map: cloudMap,
        transparent: true,
        opacity: 0.52,
        blending: THREE.NormalBlending
      });
      const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
      globeGroup.add(cloudMesh);

      // 3. NATURAL RAYLEIGH ATMOSPHERIC GLOW (Soft Royal Azure, NOT Neon Cyan)
      const atmoGeo = new THREE.SphereGeometry(earthRadius * 1.025, 64, 64);
      const atmoMat = new THREE.MeshBasicMaterial({
        color: 0x2563eb,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending
      });
      const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
      globeGroup.add(atmoMesh);

      // Equator & Tropic of Cancer Reference Rings
      const equatorPts = [];
      for (let i = 0; i <= 64; i++) {
        const a = (i / 64) * Math.PI * 2;
        equatorPts.push(new THREE.Vector3(Math.cos(a) * 1.008, 0, Math.sin(a) * 1.008));
      }
      const equatorGeo = new THREE.BufferGeometry().setFromPoints(equatorPts);
      const equatorMat = new THREE.LineBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.12 });
      const equatorLine = new THREE.Line(equatorGeo, equatorMat);
      globeGroup.add(equatorLine);

      // Tropic of Cancer (23.5°N) — Cyclone Genesis Belt
      const cancerPts = [];
      const cancerY = Math.sin(23.5 * Math.PI / 180) * 1.008;
      const cancerR = Math.cos(23.5 * Math.PI / 180) * 1.008;
      for (let i = 0; i <= 64; i++) {
        const a = (i / 64) * Math.PI * 2;
        cancerPts.push(new THREE.Vector3(Math.cos(a) * cancerR, cancerY, Math.sin(a) * cancerR));
      }
      const cancerGeo = new THREE.BufferGeometry().setFromPoints(cancerPts);
      const cancerMat = new THREE.LineDashedMaterial({ color: 0xf59e0b, dashSize: 0.05, gapSize: 0.04, transparent: true, opacity: 0.14 });
      const cancerLine = new THREE.Line(cancerGeo, cancerMat);
      cancerLine.computeLineDistances();
      globeGroup.add(cancerLine);

      // 4. CYCLONE BOB-04 3D VORTEX & LANDFALL TRAJECTORY
      const cycloneGroup = new THREE.Group();
      const cycPos = latLonToVector3(16.82, 84.48, earthRadius * 1.012);
      cycloneGroup.position.copy(cycPos);
      cycloneGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cycPos.clone().normalize());

      // Realistic Cyclone BOB-04 Spiral Cloud Arms
      const vortexArms = new THREE.Group();
      for (let layer = 0; layer < 4; layer++) {
        const radius = 0.05 + layer * 0.032;
        const ringGeo = new THREE.RingGeometry(radius - 0.015, radius, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: layer === 0 ? 0xef4444 : 0xffffff,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: layer === 0 ? 0.7 : (0.45 - layer * 0.1),
          blending: THREE.AdditiveBlending
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        vortexArms.add(ring);
      }
      cycloneGroup.add(vortexArms);

      // Eye of the Storm: Glowing Center Core
      const eyeGeo = new THREE.SphereGeometry(0.02, 16, 16);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0040, wireframe: false });
      const eyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
      cycloneGroup.add(eyeMesh);
      globeGroup.add(cycloneGroup);

      // Projected Landfall Trajectory Arc (BOB-04 -> Gopalpur, Odisha)
      const gopalpurPos = latLonToVector3(19.26, 84.91, earthRadius * 1.012);
      const midPoint = new THREE.Vector3().addVectors(cycPos, gopalpurPos).multiplyScalar(0.5).normalize().multiplyScalar(earthRadius * 1.08);
      const curve = new THREE.QuadraticBezierCurve3(cycPos, midPoint, gopalpurPos);
      const arcPoints = curve.getPoints(32);
      const arcGeo = new THREE.BufferGeometry().setFromPoints(arcPoints);
      const arcMat = new THREE.LineDashedMaterial({ color: 0xef4444, dashSize: 0.025, gapSize: 0.018, transparent: true, opacity: 0.95 });
      const arcLine = new THREE.Line(arcGeo, arcMat);
      arcLine.computeLineDistances();
      globeGroup.add(arcLine);

      // Gopalpur Landfall Target Pin
      const targetPinGeo = new THREE.CylinderGeometry(0.003, 0.003, 0.04, 8);
      const targetPinMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      const targetPin = new THREE.Mesh(targetPinGeo, targetPinMat);
      targetPin.position.copy(gopalpurPos);
      targetPin.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), gopalpurPos.clone().normalize());
      globeGroup.add(targetPin);

      // 5. INCOIS MOORED BUOY BEACONS (BD08 & BD10)
      const buoys = [
        { id: 'BD08', lat: 18.2, lon: 89.7, name: 'INCOIS BD08 (North Bay)' },
        { id: 'BD10', lat: 14.0, lon: 87.0, name: 'INCOIS BD10 (Central Bay)' }
      ];
      const buoyMeshes = [];
      buoys.forEach(b => {
        const bPos = latLonToVector3(b.lat, b.lon, earthRadius * 1.008);
        const bGroup = new THREE.Group();
        bGroup.position.copy(bPos);
        bGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), bPos.clone().normalize());

        const buoyCore = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 12), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
        const buoyRing = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.035, 16), new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
        buoyRing.rotation.x = Math.PI / 2;
        bGroup.add(buoyCore);
        bGroup.add(buoyRing);
        globeGroup.add(bGroup);
        buoyMeshes.push({ group: bGroup, ring: buoyRing });
      });

      // 6. INDIAN SATELLITE FLEET (INSAT-3DR & EOS-06)
      // Geostationary Orbit Ring for INSAT-3DR (Distance ~2.35x Earth Radius)
      const geoRadius = 2.35;
      const geoRingPts = [];
      for (let i = 0; i <= 96; i++) {
        const a = (i / 96) * Math.PI * 2;
        geoRingPts.push(new THREE.Vector3(Math.cos(a) * geoRadius, 0, Math.sin(a) * geoRadius));
      }
      const geoOrbit = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(geoRingPts),
        new THREE.LineBasicMaterial({ color: 0x2563eb, transparent: true, opacity: 0.35 })
      );
      globeGroup.add(geoOrbit);

      // INSAT-3DR Satellite at 82.0°E Geostationary slot
      const insatPos = latLonToVector3(0, 82.0, geoRadius);
      const insatGroup = new THREE.Group();
      insatGroup.position.copy(insatPos);
      insatGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), insatPos.clone().normalize());

      // Satellite Bus (Gold Foil Cube)
      const satBus = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.045, 0.06), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3, metalness: 0.8 }));
      insatGroup.add(satBus);

      // Solar Array Wings (Navy Blue Cells)
      const solarWing1 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.035, 0.004), new THREE.MeshStandardMaterial({ color: 0x1e3a8a, metalness: 0.5 }));
      solarWing1.position.set(0.1, 0, 0);
      const solarWing2 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.035, 0.004), new THREE.MeshStandardMaterial({ color: 0x1e3a8a, metalness: 0.5 }));
      solarWing2.position.set(-0.1, 0, 0);
      insatGroup.add(solarWing1);
      insatGroup.add(solarWing2);

      // Sensor Scanning Cone (projecting beam toward Bay of Bengal)
      const beamTarget = latLonToVector3(16.82, 84.48, earthRadius);
      const coneGeo = new THREE.ConeGeometry(0.42, geoRadius - earthRadius, 24, 1, true);
      const coneMat = new THREE.MeshBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      const scanCone = new THREE.Mesh(coneGeo, coneMat);
      // Orient cone towards Earth center
      scanCone.position.set(0, 0, -(geoRadius - earthRadius) / 2);
      scanCone.rotation.x = -Math.PI / 2;
      insatGroup.add(scanCone);
      globeGroup.add(insatGroup);

      // EOS-06 Polar Orbit (Inclined 98°)
      const polarGroup = new THREE.Group();
      polarGroup.rotation.z = 1.71; // 98 deg inclination
      const polarPts = [];
      const polarRadius = 1.45;
      for (let i = 0; i <= 64; i++) {
        const a = (i / 64) * Math.PI * 2;
        polarPts.push(new THREE.Vector3(Math.cos(a) * polarRadius, 0, Math.sin(a) * polarRadius));
      }
      const polarOrbit = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(polarPts),
        new THREE.LineBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.3 })
      );
      polarGroup.add(polarOrbit);

      const eosSat = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.035, 0.04), new THREE.MeshStandardMaterial({ color: 0x34d399, metalness: 0.6 }));
      polarGroup.add(eosSat);
      globeGroup.add(polarGroup);

      // 7. Background Twinkling Starfield
      const starsCount = 650;
      const starGeo = new THREE.BufferGeometry();
      const starPos = [];
      for (let i = 0; i < starsCount; i++) {
        const r = 25 + Math.random() * 40;
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        starPos.push(r * Math.sin(phi) * Math.cos(theta));
        starPos.push(r * Math.sin(phi) * Math.sin(theta));
        starPos.push(r * Math.cos(phi));
      }
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.6, transparent: true, opacity: 0.7 });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

      // 8. Interaction State & Unified Pointer Event Listeners
      let isDragging = false;
      let prevMouseX = 0;
      let prevMouseY = 0;
      let targetRotY = globeGroup.rotation.y;
      let targetRotX = globeGroup.rotation.x;
      let targetCamDist = initialDist;
      let autoRotate = state.globeAutoRotate !== false;
      let polarAngle = 0;

      // Prevent native selection / gesture hijacking on canvas
      container.style.touchAction = 'none';
      container.style.userSelect = 'none';
      if (renderer && renderer.domElement) {
        renderer.domElement.style.touchAction = 'none';
        renderer.domElement.style.userSelect = 'none';
        renderer.domElement.style.cursor = 'grab';
      }

      // Universal Pointer Down Handler
      function onPointerDown(e) {
        // If tactical deck is open or hovering over tactical HUD, tabs, or modals, do not drag globe
        if (typeof isTacticalExpanded !== 'undefined' && isTacticalExpanded) {
          return;
        }
        // If clicking on an active button, link, modal, or the dock pill, let it handle its own click
        if (state.activePortalView === 'command_center') {
          if (e.target && e.target.closest && e.target.closest('#commandCenterPage, button, a, input, select, textarea, [role="button"], #tacticalDeckScrollArea, .custom-scrollbar, .modal')) {
            return;
          }
        }
        if (e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, [role="button"], #heroDock, #tacticalHudOverlay, #tacticalDeckScrollArea, #commandCenterPage, #officerLoginModal, #createAccountModal, #forgotPasswordModal, #weatherDetailsModal, .modal')) {
          return;
        }
        isDragging = true;
        prevMouseX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        prevMouseY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

        container.style.cursor = 'grabbing';
        if (renderer && renderer.domElement) renderer.domElement.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';

        if (e.target && e.target.setPointerCapture && e.pointerId !== undefined) {
          try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
        }
      }

      // Universal Pointer Move Handler
      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        const dx = clientX - prevMouseX;
        const dy = clientY - prevMouseY;
        prevMouseX = clientX;
        prevMouseY = clientY;

        targetRotY += dx * 0.0065;
        targetRotX += dy * 0.0065;
        // Clamp vertical pitch to prevent gimbal flip
        targetRotX = Math.max(-1.35, Math.min(1.35, targetRotX));
      }

      // Universal Pointer Up / End Handler
      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        container.style.cursor = 'grab';
        if (renderer && renderer.domElement) renderer.domElement.style.cursor = 'grab';
        document.body.style.userSelect = '';
        if (e && e.target && e.target.releasePointerCapture && e.pointerId !== undefined) {
          try { e.target.releasePointerCapture(e.pointerId); } catch (err) {}
        }
      }

      // Zoom via Mouse Wheel
      function onWheel(e) {
        // If on dedicated command center page or tactical deck is active, never zoom the earth!
        if (state.activePortalView === 'command_center' || (typeof isTacticalExpanded !== 'undefined' && isTacticalExpanded)) {
          return; // Let the tab content scroll naturally
        }
        if (e.target && e.target.closest && e.target.closest('#tacticalHudOverlay, #tacticalDeckScrollArea, #commandCenterPage, #officerLoginModal, #createAccountModal, #forgotPasswordModal, #weatherDetailsModal, #widgets-section, .modal')) {
          return; // Let modal, tabs, or widgets scroll naturally
        }
        // On the interface page, allow natural vertical page scroll down to widgets unless user uses Ctrl/Cmd zoom
        if (containerId === 'prefaceInteractiveGlobe' && !e.ctrlKey && !e.metaKey) {
          return; // Natural page scroll smoothly moves down to the widgets!
        }
        const isOverGlobe = e.target.closest('#' + containerId) || (renderer && e.target === renderer.domElement) || (!isTacticalExpanded && e.target.closest('#heroGlobeSection'));
        if (isOverGlobe) {
          e.preventDefault();
          targetCamDist += e.deltaY * 0.0022;
          targetCamDist = Math.max(1.32, Math.min(4.5, targetCamDist));
        }
      }

      // Attach interaction listeners across container, canvas, and hero section
      const attachTargets = [container];
      if (renderer && renderer.domElement) attachTargets.push(renderer.domElement);
      const heroSection = document.getElementById('heroGlobeSection');
      if (containerId === 'prefaceInteractiveGlobe' && heroSection) {
        attachTargets.push(heroSection);
      }

      attachTargets.forEach(tgt => {
        if (!tgt) return;
        tgt.addEventListener('pointerdown', onPointerDown);
        tgt.addEventListener('mousedown', onPointerDown);
        tgt.addEventListener('touchstart', onPointerDown, { passive: true });
        tgt.addEventListener('wheel', onWheel, { passive: false });
      });

      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);

      // Window Resize Handler
      function handleResize() {
        if (!container) return;
        const w = container.clientWidth || container.offsetWidth || 800;
        const h = container.clientHeight || container.offsetHeight || 500;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', handleResize);

      // Animation Loop
      let animId = null;
      let pulseTime = 0;

      function animate() {
        animId = requestAnimationFrame(animate);
        pulseTime += 0.025;

        // Auto rotation when not dragging
        if (autoRotate && !isDragging) {
          targetRotY += 0.0012;
        }

        // Smooth damping interpolation
        globeGroup.rotation.y += (targetRotY - globeGroup.rotation.y) * 0.08;
        globeGroup.rotation.x += (targetRotX - globeGroup.rotation.x) * 0.08;
        camera.position.z += (targetCamDist - camera.position.z) * 0.08;

        // Real-Time Earth Coordinate Calculation facing viewer
        if (containerId === 'prefaceInteractiveGlobe') {
          const localCamPos = globeGroup.worldToLocal(camera.position.clone()).normalize();
          const lat = Math.asin(Math.max(-1.0, Math.min(1.0, localCamPos.y))) * (180 / Math.PI);
          let lon = (Math.atan2(localCamPos.z, -localCamPos.x) * (180 / Math.PI)) - 180;
          while (lon < -180) lon += 360;
          while (lon > 180) lon -= 360;

          const coordElem = document.getElementById('livePrefaceCoordinates');
          if (coordElem) {
            const latDeg = Math.floor(Math.abs(lat));
            const latMin = Math.round((Math.abs(lat) - latDeg) * 60);
            const latDir = lat >= 0 ? 'N' : 'S';

            const lonDeg = Math.floor(Math.abs(lon));
            const lonMin = Math.round((Math.abs(lon) - lonDeg) * 60);
            const lonDir = lon >= 0 ? 'E' : 'W';

            const pad = (n) => n < 10 ? '0' + n : n;
            coordElem.textContent = `${pad(latDeg)}° ${pad(latMin)}' ${latDir}   ${pad(lonDeg)}° ${pad(lonMin)}' ${lonDir}`;
          }

          // Dynamic Nearest Cyclone Telemetry Tracking
          const cyclonePill = document.getElementById('nearestCyclonePill');
          if (cyclonePill) {
            const activeCyclones = [
              { name: 'CYCLONE BOB-04 (VSCS)', speed: '155 KM/H', basin: 'BAY OF BENGAL', lat: 16.82, lon: 84.48 }
            ];

            let nearest = null;
            let minDist = Infinity;
            const toRad = Math.PI / 180;

            activeCyclones.forEach(c => {
              const dLat = (c.lat - lat) * toRad;
              const dLon = (c.lon - lon) * toRad;
              const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.cos(lat * toRad) * Math.cos(c.lat * toRad) *
                        Math.sin(dLon / 2) * Math.sin(dLon / 2);
              const dist = 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
              if (dist < minDist) {
                minDist = dist;
                nearest = c;
              }
            });

            // Proximity threshold: 3,200 KM
            if (nearest && minDist <= 3200) {
              if (cyclonePill.getAttribute('data-status') !== 'cyclone') {
                cyclonePill.setAttribute('data-status', 'cyclone');
                cyclonePill.innerHTML = `
                  <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                  <span class="text-slate-200">${nearest.name}</span>
                  <span class="text-slate-600">•</span>
                  <span class="text-cyan-300 font-bold">${nearest.speed}</span>
                  <span class="text-slate-600">•</span>
                  <span class="text-slate-400">${nearest.basin}</span>
                `;
              }
            } else {
              if (cyclonePill.getAttribute('data-status') !== 'calm') {
                cyclonePill.setAttribute('data-status', 'calm');
                cyclonePill.innerHTML = `
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span class="text-slate-300 font-medium tracking-wide">NO CYCLONE FORMATION NEARBY</span>
                `;
              }
            }
          }
        }

        // Real Atmospheric Cloud Circulation
        if (typeof cloudMesh !== 'undefined' && cloudMesh) {
          cloudMesh.rotation.y += 0.00035;
        }

        // Rotate Cyclone BOB-04 Vortex Arms (Counter-Clockwise cyclonic rotation)
        vortexArms.rotation.z += 0.035;

        // Pulse Eye of Cyclone Core
        const eyeScale = 1.0 + Math.sin(pulseTime * 3) * 0.35;
        eyeMesh.scale.set(eyeScale, eyeScale, eyeScale);

        // Pulse INCOIS buoy rings
        buoyMeshes.forEach((bm, idx) => {
          const s = 1.0 + Math.sin(pulseTime * 2.5 + idx) * 0.4;
          bm.ring.scale.set(s, s, s);
        });

        // Orbit EOS-06 satellite around polar loop
        polarAngle += 0.015;
        eosSat.position.set(Math.cos(polarAngle) * polarRadius, 0, Math.sin(polarAngle) * polarRadius);

        // Slowly twinkle starfield
        stars.rotation.y += 0.00015;

        renderer.render(scene, camera);
      }

      animate();

      // Store instance handles for external controls
      activeGlobeInstances[containerId] = {
        scene,
        camera,
        renderer,
        globeGroup,
        animId,
        setTargetRotation: (rx, ry, dist) => {
          targetRotX = rx;
          targetRotY = ry;
          if (dist) targetCamDist = dist;
        },
        toggleAutoRotate: () => {
          autoRotate = !autoRotate;
          return autoRotate;
        },
        setAutoRotate: (val) => {
          autoRotate = val;
        }
      };
    }

    // Scroll-reveal animations controller for Pixel Weather Widgets
    function initWidgetScrollAnimations() {
      const cards = document.querySelectorAll('.pixel-widget-card');
      const header = document.getElementById('widgetsHeader');
      if (!cards || cards.length === 0) return;

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('widget-revealed');
            }
          });
        }, {
          threshold: 0.08,
          rootMargin: '0px 0px -40px 0px'
        });

        if (header) observer.observe(header);
        cards.forEach(card => observer.observe(card));
      } else {
        if (header) header.classList.add('widget-revealed');
        cards.forEach(card => card.classList.add('widget-revealed'));
      }

      function checkScroll() {
        const triggerBottom = window.innerHeight * 0.95;
        if (header && header.getBoundingClientRect().top < triggerBottom) {
          header.classList.add('widget-revealed');
        }
        cards.forEach(card => {
          if (card.getBoundingClientRect().top < triggerBottom) {
            card.classList.add('widget-revealed');
          }
        });
      }

      window.addEventListener('scroll', checkScroll, { passive: true });
      setTimeout(checkScroll, 120);
      setTimeout(checkScroll, 450);
    }

    function renderApp() {
      setTimeout(mountAllGlobes, 40);
      setTimeout(initWidgetScrollAnimations, 60);
      const container = document.getElementById('app');
      if (!container) return;

      if (state.activePortalView === 'command_center') {
        if (!state.isLoggedIn) {
          state.activePortalView = 'portal';
          state.pendingAction = () => {
            state.activePortalView = 'command_center';
            renderApp();
          };
          setTimeout(openLoginModal, 150);
          return;
        }
        container.innerHTML = `
          ${renderCommandCenterPage()}
          ${renderOfficerLoginModal()}
          ${renderCreateAccountModal()}
          ${renderForgotPasswordModal()}
          ${renderLoadingScreen()}
        `;
        initTacticalDeckEvents();
        return;
      }

      if (state.activePortalView === 'login') {
        container.innerHTML = `
          ${renderLoginPage()}
        `;
        return;
      }

      // THE PUBLIC PORTAL IS THE MAIN INTERFACE PAGE
      container.innerHTML = `
        ${renderNasaPortal()}
        ${renderOfficerLoginModal()}
        ${renderCreateAccountModal()}
        ${renderForgotPasswordModal()}
        ${renderLoadingScreen()}
      `;
      setTimeout(initWidgetScrollAnimations, 80);
    }

    // Initialize application and fetch initial live observation
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.location.search.includes('view=command') && !window.location.hash.includes('command')) {
        window.scrollTo(0, 0);
      }
      renderApp();
      mountAllGlobes();
      initTacticalDeckEvents();
      initWidgetScrollAnimations();
      fetchRealtimeWeather('gopalpur');
      fetchRiskMatrix();
      const btn = document.getElementById('launchTacticalBtn');
      if (btn) btn.addEventListener('click', () => launchTacticalDeck());
      // Auto-launch if URL contains view=command or hash #command
      if (window.location.search.includes('view=command') || window.location.hash.includes('command')) {
        setTimeout(launchTacticalDeck, 200);
      }
    });

    window.addEventListener('load', () => {
      if (!window.location.search.includes('view=command') && !window.location.hash.includes('command')) {
        window.scrollTo(0, 0);
      }
    });

    if (!window.location.search.includes('view=command') && !window.location.hash.includes('command')) {
      window.scrollTo(0, 0);
    }
    renderApp();
    initTacticalDeckEvents();
    initWidgetScrollAnimations();
    fetchRiskMatrix();
  </script>
